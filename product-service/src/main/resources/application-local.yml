server:
  port: 8082

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:productdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  redis:
    host: localhost
    port: 6379
    timeout: 10000ms
    # enabled: false

logging:
  level:
    org.springframework: INFO
    com.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE