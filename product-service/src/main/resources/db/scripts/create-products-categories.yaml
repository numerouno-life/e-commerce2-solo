databaseChangeLog:
  # ===== ТАБЛИЦА КАТЕГОРИЙ =====
  - changeSet:
      id: create-categories-table
      author: Irina Gavrilina, modified by V1chers
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

  # ===== ОСНОВНАЯ ТАБЛИЦА ТОВАРОВ =====
  - changeSet:
      id: create-products-table
      author: Irina Gavrilina, modified by V1chers
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(5000)
              - column:
                  name: price
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
              - column:
                  name: brand
                  type: VARCHAR(50)
              - column:
                  name: stock_quantity
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: image_url
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category

        - createIndex:
            tableName: products
            indexName: idx_products_name
            columns:
              - column:
                  name: name
        - createIndex:
            tableName: products
            indexName: idx_products_category
            columns:
              - column:
                  name: category_id
        - createIndex:
            tableName: products
            indexName: idx_products_price
            columns:
              - column:
                  name: price