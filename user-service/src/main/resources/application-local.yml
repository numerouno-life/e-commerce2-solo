server:
  port: 8081

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:userdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  redis:
    host: localhost
    port: 6379
    timeout: 10000ms

jwt:
  secret: local-dev-secret-key-for-testing-only-change-in-production
  expiration: 86400000

logging:
  level:
    org.springframework: INFO
    com.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG